- name: demo on loops
  hosts: local
  connection: local
  become: true
  tasks:
    - name: print names
      ansible.builtin.package:
          name: "{{ item.name }}"
          state: "{{ item.state }}"
      loop:
        - { name: "nginx",state: "present" }
        - { name: "mysql",state: "present" }
        - { name: "zip" ,state: "present" }