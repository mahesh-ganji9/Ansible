- name: gathering facts
  hosts: local
  connection: local
  tasks:
  - name: print facts
    ansible.builtin.debug:
      msg: "{{ ansible_facts }}"

  - name: check redhat or not
    ansible.builtin.debug:
      msg: "Yes , if it is redhat"
    when: ansible_facts.os_family == "RedHat"

  - name: check redhat or not
    ansible.builtin.debug:
      msg: "Yes , if it is Debian"
    when: ansible_facts.os_family == "Debian"